<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Relevant Book Content</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header class="reader-header">
    <button id="back" class="back-button" type="button" hidden>← Matches</button>
    <div class="reader-title">
      <strong id="reader-kicker">Relevant Book Content</strong>
      <span id="reader-context">Databricks Data Intelligence Platform</span>
    </div>
  </header>
  <main id="content" class="content" tabindex="-1">
    <section class="empty-state">
      <h1>Select an architecture component</h1>
      <p>Click a box in the architecture diagram to see the most relevant passages from the book.</p>
    </section>
  </main>
  <div id="status" class="sr-only" aria-live="polite"></div>
  <script src="reader.js"></script>
</body>
</html>
